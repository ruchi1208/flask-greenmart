<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 – Server Error | GreenMart</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --green-deep:  #1a4a22;
            --green-mid:   #2e7d32;
            --green-light: #66bb6a;
            --green-pale:  #e8f5e9;
            --amber:       #f59e0b;
            --amber-pale:  #fffbeb;
            --cream:       #faf9f6;
            --text-dark:   #1c2b1e;
            --text-muted:  #6b7a6d;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--cream);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* ── Warm amber background blobs for "error" feel ── */
        .bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.14;
            pointer-events: none;
            animation: drift 14s ease-in-out infinite alternate;
        }
        .bg-blob-1 { width: 480px; height: 480px; background: var(--amber);      top: -120px; right: -120px; animation-delay: 0s; }
        .bg-blob-2 { width: 320px; height: 320px; background: var(--green-mid);   bottom: -80px; left: -80px; animation-delay: -5s; }
        .bg-blob-3 { width: 220px; height: 220px; background: var(--green-light); top: 40%; left: 20%; animation-delay: -9s; }

        @keyframes drift {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(25px, 18px) scale(1.06); }
        }

        /* ── Card ── */
        .error-card {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 540px;
            width: 90%;
            padding: 60px 48px;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 28px;
            box-shadow: 0 24px 80px rgba(245, 158, 11, 0.1), 0 4px 24px rgba(26, 74, 34, 0.08);
            animation: cardIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0)    scale(1); }
        }

        /* ── Gear/wrench icon spin ── */
        .error-icon {
            font-size: 60px;
            display: block;
            margin-bottom: 16px;
            animation: gearSpin 4s linear infinite;
            display: inline-block;
        }
        @keyframes gearSpin {
            0%   { transform: rotate(0deg);   }
            20%  { transform: rotate(30deg);  }
            40%  { transform: rotate(20deg);  }
            60%  { transform: rotate(50deg);  }
            80%  { transform: rotate(40deg);  }
            100% { transform: rotate(360deg); }
        }

        /* ── 500 number ── */
        .error-code {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(80px, 18vw, 130px);
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, var(--amber), #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -4px;
            margin-bottom: 8px;
        }

        .error-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 12px;
        }

        .error-desc {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 28px;
        }

        /* ── Status box ── */
        .status-box {
            background: var(--amber-pale);
            border: 1px solid #fde68a;
            border-radius: 14px;
            padding: 14px 20px;
            font-size: 13px;
            color: #92400e;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
        }
        .status-box span:first-child { font-size: 20px; flex-shrink: 0; }

        /* ── Countdown auto-refresh ── */
        .refresh-hint {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 28px;
        }
        .countdown { font-weight: 700; color: var(--amber); font-size: 15px; }

        /* ── Buttons ── */
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--green-deep), var(--green-mid));
            color: #fff;
            text-decoration: none;
            padding: 14px 30px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 6px 24px rgba(46, 125, 50, 0.35);
            margin-right: 10px;
            margin-bottom: 12px;
            cursor: pointer;
            border: none;
            font-family: inherit;
        }
        .btn-home:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(46, 125, 50, 0.45); }

        .btn-retry {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--amber-pale);
            color: #92400e;
            text-decoration: none;
            padding: 13px 26px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 500;
            border: 2px solid #fde68a;
            transition: all 0.2s;
            margin-bottom: 12px;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-retry:hover { background: #fef3c7; border-color: var(--amber); transform: translateY(-2px); }

        /* ── Logo ── */
        .logo {
            position: fixed;
            top: 28px;
            left: 36px;
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--green-deep);
            text-decoration: none;
            z-index: 100;
        }

        /* ── Particles ── */
        .particles { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
        .particle {
            position: absolute;
            opacity: 0.1;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            from { transform: translateY(110vh) rotate(0deg);   opacity: 0.12; }
            to   { transform: translateY(-10vh) rotate(360deg); opacity: 0;    }
        }
    </style>
</head>
<body>

    <a href="{{ url_for('views.home') }}" class="logo">🌿 GreenMart</a>

    <div class="bg-blob bg-blob-1"></div>
    <div class="bg-blob bg-blob-2"></div>
    <div class="bg-blob bg-blob-3"></div>

    <div class="particles" id="particles"></div>

    <div class="error-card">
        <span class="error-icon">⚙️</span>
        <div class="error-code">500</div>
        <h1 class="error-title">Something Went Wrong</h1>
        <p class="error-desc">
            Our servers are taking a short break — like fresh produce needs time to ripen!<br>
            We're on it. Please try again in a moment.
        </p>

        <div class="status-box">
            <span>⚠️</span>
            <span>Our team has been notified and is working to fix this. Sorry for the inconvenience!</span>
        </div>

        <p class="refresh-hint">Auto-refreshing in <span class="countdown" id="cd">15</span>s…</p>

        <div>
            <a href="{{ url_for('views.home') }}" class="btn-home">🏠 Go Home</a>
            <button onclick="location.reload()" class="btn-retry">🔄 Try Again</button>
        </div>
    </div>

    <script>
        // Particles
        const emojis = ['⚙️','🔧','🌿','🍃','🌱'];
        const container = document.getElementById('particles');
        for (let i = 0; i < 12; i++) {
            const p = document.createElement('span');
            p.className = 'particle';
            p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = (12 + Math.random() * 16) + 's';
            p.style.animationDelay = -(Math.random() * 20) + 's';
            p.style.fontSize = (14 + Math.random() * 18) + 'px';
            container.appendChild(p);
        }

        // Countdown auto-refresh
        let sec = 15;
        const cd = document.getElementById('cd');
        const timer = setInterval(() => {
            sec--;
            cd.textContent = sec;
            if (sec <= 0) { clearInterval(timer); location.reload(); }
        }, 1000);
    </script>
</body>
</html>
