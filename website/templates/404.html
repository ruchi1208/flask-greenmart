<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 – Page Not Found | GreenMart</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --green-deep:  #1a4a22;
            --green-mid:   #2e7d32;
            --green-light: #66bb6a;
            --green-pale:  #e8f5e9;
            --cream:       #faf9f6;
            --text-dark:   #1c2b1e;
            --text-muted:  #6b7a6d;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--cream);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* ── Organic background blobs ── */
        .bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.18;
            pointer-events: none;
            animation: drift 12s ease-in-out infinite alternate;
        }
        .bg-blob-1 { width: 500px; height: 500px; background: var(--green-mid);  top: -150px; left: -150px; animation-delay: 0s; }
        .bg-blob-2 { width: 350px; height: 350px; background: var(--green-light); bottom: -100px; right: -100px; animation-delay: -4s; }
        .bg-blob-3 { width: 250px; height: 250px; background: var(--green-deep); top: 50%; left: 60%; animation-delay: -8s; }

        @keyframes drift {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(30px, 20px) scale(1.05); }
        }

        /* ── Card ── */
        .error-card {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 520px;
            width: 90%;
            padding: 60px 48px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(46, 125, 50, 0.15);
            border-radius: 28px;
            box-shadow: 0 24px 80px rgba(26, 74, 34, 0.12);
            animation: cardIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0)    scale(1); }
        }

        /* ── Leaf emoji bounce ── */
        .leaf-icon {
            font-size: 64px;
            display: block;
            margin-bottom: 16px;
            animation: leafBounce 2.4s ease-in-out infinite;
            transform-origin: bottom center;
        }
        @keyframes leafBounce {
            0%, 100% { transform: rotate(-8deg) scale(1);   }
            50%       { transform: rotate( 8deg) scale(1.1); }
        }

        /* ── Big 404 number ── */
        .error-code {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(80px, 18vw, 130px);
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, var(--green-deep), var(--green-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -4px;
            margin-bottom: 8px;
        }

        .error-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 12px;
        }

        .error-desc {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 36px;
        }

        /* ── Divider leaves ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 32px;
            justify-content: center;
        }
        .divider span { font-size: 18px; }
        .divider-line { flex: 1; max-width: 60px; height: 1px; background: linear-gradient(to right, transparent, var(--green-light), transparent); }

        /* ── Buttons ── */
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--green-deep), var(--green-mid));
            color: #fff;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.3px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 6px 24px rgba(46, 125, 50, 0.35);
            margin-right: 12px;
            margin-bottom: 12px;
        }
        .btn-home:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(46, 125, 50, 0.45); }

        .btn-shop {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            color: var(--green-mid);
            text-decoration: none;
            padding: 13px 28px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 500;
            border: 2px solid var(--green-light);
            transition: all 0.2s;
            margin-bottom: 12px;
        }
        .btn-shop:hover { background: var(--green-pale); border-color: var(--green-mid); transform: translateY(-2px); }

        /* ── Logo top ── */
        .logo {
            position: fixed;
            top: 28px;
            left: 36px;
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--green-deep);
            text-decoration: none;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ── Floating particles ── */
        .particles { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
        .particle {
            position: absolute;
            font-size: 20px;
            opacity: 0.12;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            from { transform: translateY(110vh) rotate(0deg);   opacity: 0.15; }
            to   { transform: translateY(-10vh) rotate(360deg); opacity: 0;    }
        }
    </style>
</head>
<body>

    <a href="{{ url_for('views.home') }}" class="logo">🌿 GreenMart</a>

    <!-- Background blobs -->
    <div class="bg-blob bg-blob-1"></div>
    <div class="bg-blob bg-blob-2"></div>
    <div class="bg-blob bg-blob-3"></div>

    <!-- Floating leaf particles -->
    <div class="particles" id="particles"></div>

    <div class="error-card">
        <span class="leaf-icon">🍃</span>
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-desc">
            Oops! This page seems to have wandered off into the fields.<br>
            Let's get you back to the fresh produce!
        </p>

        <div class="divider">
            <span class="divider-line"></span>
            <span>🌱</span>
            <span class="divider-line"></span>
        </div>

        <div>
            <a href="{{ url_for('views.home') }}" class="btn-home">🏠 Go Home</a>
            <a href="{{ url_for('views.shop') }}"  class="btn-shop">🛒 Shop Now</a>
        </div>
    </div>

    <script>
        // Spawn floating leaf particles
        const emojis = ['🍃','🌿','🌱','🥦','🍎','🥕'];
        const container = document.getElementById('particles');
        for (let i = 0; i < 14; i++) {
            const p = document.createElement('span');
            p.className = 'particle';
            p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = (10 + Math.random() * 18) + 's';
            p.style.animationDelay = -(Math.random() * 20) + 's';
            p.style.fontSize = (14 + Math.random() * 20) + 'px';
            container.appendChild(p);
        }
    </script>
</body>
</html>
